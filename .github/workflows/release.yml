name: Release

# A tag v* builds the wheel and sdist and publishes them to PyPI with Trusted Publishing (OIDC):
# no API token is stored. The PyPI project must list this repository, this workflow file and the
# environment "pypi" as a trusted publisher first (docs/RELEASING.md).
#
# Run by hand (Actions → Release → Run workflow, or `gh workflow run release.yml`) for a rehearsal:
#   publish=none      dry run: version check, tests, build, check_dist and twine; the files are
#                     uploaded as the run's artifact "dist" and nothing is published (default)
#   publish=testpypi  the same, then Trusted Publishing to TestPyPI (environment "testpypi")
#   publish=pypi      the same, then Trusted Publishing to PyPI (environment "pypi")
# expected_version must equal the version in pyproject.toml; it is required unless publish=none.
# docs/RELEASING.md has the commands and the TestPyPI pending publisher.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "none = dry run (nothing published); testpypi; pypi"
        type: choice
        options: [none, testpypi, pypi]
        default: none
      expected_version:
        description: "The version pyproject.toml must hold (required unless publish=none)"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
      - name: Version matches the tag and the expected version
        id: version
        env:
          PUBLISH: ${{ inputs.publish }}
          EXPECTED: ${{ inputs.expected_version }}
        run: |
          version=$(uv run --no-project python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "pyproject.toml version: ${version} (ref ${GITHUB_REF_TYPE} ${GITHUB_REF_NAME})"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            test "v${version}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != v${version}"; exit 1; }
          fi
          if [ -n "${EXPECTED}" ]; then
            test "${version}" = "${EXPECTED}" || { echo "expected ${EXPECTED}, found ${version}"; exit 1; }
          elif [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ "${PUBLISH}" != "none" ]; then
            echo "expected_version is required to publish (publish=${PUBLISH})"; exit 1
          fi
      - name: Test (256 open files, as in CI)
        run: |
          uv sync --frozen --all-extras
          ulimit -n 256
          uv run pytest -q
      - name: Build and check
        run: |
          uv build
          uv run python scripts/check_dist.py dist/*.whl dist/*.tar.gz
          uvx --from "twine==7.0.0" twine check --strict dist/*
      - name: Checksums
        run: |
          sha256sum dist/*
          {
            echo "### rvg-runtime ${{ steps.version.outputs.version }}"
            echo
            echo "| file | sha256 |"
            echo "|---|---|"
            for f in dist/*; do echo "| $(basename "$f") | \`$(sha256sum "$f" | cut -d' ' -f1)\` |"; done
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    if: github.event_name == 'push' || inputs.publish == 'testpypi' || inputs.publish == 'pypi'
    runs-on: ubuntu-24.04
    environment:
      name: ${{ inputs.publish == 'testpypi' && 'testpypi' || 'pypi' }}
      url: ${{ inputs.publish == 'testpypi' && 'https://test.pypi.org/project/rvg-runtime/' || 'https://pypi.org/project/rvg-runtime/' }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Publish to TestPyPI
        if: inputs.publish == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
      - name: Publish to PyPI
        if: inputs.publish != 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
